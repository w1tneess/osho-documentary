# ——— Academic Sources ———

- id: carter-2011
  title: 'Charisma and Control in Rajneesh Communities'
  author: 'Lewis Carter'
  year: 2011
  publisher: 'Cambridge University Press'
  type: academic
  notes: 'Sociological analysis of commune dynamics, leadership structures, and group psychology.'

- id: hassan-2015
  title: 'Combating Cult Mind Control'
  author: 'Steven Hassan'
  year: 2015
  publisher: 'Park Street Press'
  type: academic
  notes: 'Framework for understanding undue influence in high-demand groups. References Rajneesh movement.'

- id: lalich-langone-2006
  title: 'Take Back Your Life: Recovering from Cults and Abusive Relationships'
  author: 'Janja Lalich & Michael D. Langone'
  year: 2006
  publisher: 'Bay Tree Publishing'
  type: academic
  notes: 'Recovery framework for ex-members of high-demand groups.'

- id: goleman-davidson-2017
  title: 'Altered Traits: Science Reveals How Meditation Changes Your Mind and Body'
  author: 'Daniel Goleman & Richard J. Davidson'
  year: 2017
  publisher: 'Bantam'
  type: academic
  notes: 'Meta-analysis of meditation research. Supports efficacy of meditation practices Osho promoted.'

- id: vanderKolk-2014
  title: 'The Body Keeps the Score: Brain, Mind, and Body in the Healing of Trauma'
  author: 'Bessel van der Kolk'
  year: 2014
  publisher: 'Penguin'
  type: academic
  notes: 'Foundational work on trauma and body-based therapies. Relevant to understanding cathartic therapy impact.'

