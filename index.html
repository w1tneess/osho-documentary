<!doctype html>
<html lang="en" class="webgl-fallback">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- ── SEO ────────────────────────────────────────────────────────────
         The previous markup carried replacement characters (U+FFFD) in both the
         description and the structured data, where an em dash and an en dash
         were meant, and preloaded a font family the stylesheet never asked
         for — so the browser fetched two stylesheets, rendered with fallback
         faces, and published mojibake to every crawler and social preview.
    -->
    <title>Osho Rajneesh: A Documentary Analysis</title>
    <meta
      name="description"
      content="A critical, evidence-based examination of Osho Rajneesh (1931–1990): his philosophy, the movement he founded, the harm it caused, and what he got right. Built from court records, recorded discourses, and scholarship."
    />
    <link rel="canonical" href="https://osho.advaitachandra.in/" />
    <meta name="author" content="Advait Chandra" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0c0a08" />
    <meta name="color-scheme" content="dark" />

    <!-- ── Open Graph ───────────────────────────────────────────────────── -->
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="Osho Documentary" />
    <meta property="og:locale" content="en" />
    <meta property="og:title" content="Osho Rajneesh: A Documentary Analysis" />
    <meta
      property="og:description"
      content="Philosophy, outcomes, and the truth behind the movement. Nine chapters, built from court records, official biographies, recorded discourses, and contemporary scholarship."
    />
    <meta property="og:url" content="https://osho.advaitachandra.in/" />
    <meta property="og:image" content="https://osho.advaitachandra.in/og/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Osho Rajneesh documentary title card" />

    <!-- ── Twitter / X ──────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Osho Rajneesh: A Documentary Analysis" />
    <meta
      name="twitter:description"
      content="Philosophy, outcomes, and the truth behind the movement. A critical examination built on evidence, not hagiography."
    />
    <meta name="twitter:image" content="https://osho.advaitachandra.in/og/og-image.png" />
    <meta name="twitter:image:alt" content="Osho Rajneesh documentary title card" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- ── Fonts ──────────────────────────────────────────────────────────
         The stylesheet asks for EB Garamond, Inter and JetBrains Mono, and this
         is the same request. Preloading a different family is a wasted
         connection: the old markup preloaded Bebas Neue and EB Garamond while
         global.css @imported Playfair Display and Plus Jakarta Sans, so the
         preload was never consumed and the @import was render-blocking.

         `display=swap` means the page paints in the fallback face immediately
         and swaps when the webfont arrives, which is why the critical inline
         styles below exist.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>

    <!-- ── Critical inline styles ──────────────────────────────────────────
         Ink on near-black from the first paint, so the first frame is the
         documentary's palette and not a white flash. The `webgl-fallback`
         class is removed by App.tsx once WebGL is confirmed.
    -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow-x: clip;
        background: #0c0a08;
        color: #f2ebdd;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .skip-link {
        position: fixed;
        top: 0;
        left: 1rem;
        z-index: 9999;
        transform: translateY(-160%);
        padding: 0.75rem 1.15rem;
        background: #faf6ee;
        color: #14100c;
        font: 600 0.8125rem/1 'Inter', system-ui, sans-serif;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        text-decoration: none;
        border-radius: 0 0 6px 6px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
        transition: transform 0.26s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .skip-link:focus-visible {
        transform: translateY(0);
        outline-offset: -4px;
      }
    </style>

    <!-- ── Structured data ────────────────────────────────────────────────
         Article plus a BreadcrumbList: the chapter list is real navigation,
         and a search engine can be told so rather than left to infer it.
    -->
    <script type="application/ld+json">

            "@type": "Article",
            "@id": "https://osho.advaitachandra.in/#article",
            "headline": "Osho Rajneesh: A Documentary Analysis",
            "description": "A critical, evidence-based examination of Osho Rajneesh (1931–1990): his philosophy, the movement he founded, the harm it caused, and what he got right.",
            "inLanguage": "en",
            "datePublished": "2025-01-01",
            "dateModified": "2025-01-01",
            "author": { "@type": "Person", "name": "Advait Chandra" },
            "publisher": { "@type": "Person", "name": "Advait Chandra" },
            "mainEntityOfPage": {
              "@type": "WebPage",
              "@id": "https://osho.advaitachandra.in/"
            },
            "image": ["https://osho.advaitachandra.in/og/og-image.png"],
            "about": {
              "@type": "Person",
              "name": "Osho",
              "alternateName": ["Bhagwan Shree Rajneesh", "Acharya Rajneesh", "Chandra Mohan Jain"],
              "birthDate": "1931-12-11",
              "deathDate": "1990-01-19"
            }
          },
          {
            "@type": "BreadcrumbList",
            "itemListElement": [
              { "@type": "ListItem", "position": 1, "name": "Opening", "item": "https://osho.advaitachandra.in/#hero" },
              { "@type": "ListItem", "position": 2, "name": "Prologue", "item": "https://osho.advaitachandra.in/#prologue" },
              { "@type": "ListItem", "position": 3, "name": "Chapter 1 — Early Life and Claimed Enlightenment", "item": "https://osho.advaitachandra.in/#chapter-early-life" },
              { "@type": "ListItem", "position": 4, "name": "Chapter 2 — Founding the Movement", "item": "https://osho.advaitachandra.in/#chapter-founding-movement" },
              { "@type": "ListItem", "position": 5, "name": "Chapter 3 — Pune Ashram", "item": "https://osho.advaitachandra.in/#chapter-pune-ashram" },
              { "@type": "ListItem", "position": 6, "name": "Chapter 4 — The Oregon Commune", "item": "https://osho.advaitachandra.in/#chapter-rajneeshpuram" },

              { "@type": "ListItem", "position": 10, "name": "Chapter 8 — Final Years and the Question of Responsibility", "item": "https://osho.advaitachandra.in/#chapter-final-years" },
              { "@type": "ListItem", "position": 11, "name": "Chapter 9 — Impact and Legacy", "item": "https://osho.advaitachandra.in/#chapter-impact-legacy" },
              { "@type": "ListItem", "position": 12, "name": "Conclusion — The Paradox of Osho", "item": "https://osho.advaitachandra.in/#epilogue" },
              { "@type": "ListItem", "position": 13, "name": "References", "item": "https://osho.advaitachandra.in/#references" }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <a href="#hero" class="skip-link">Skip to content</a>
    <div id="root"></div>
    <noscript>
      <div style="padding: 4rem 1.5rem; max-width: 40rem; margin: 0 auto; line-height: 1.7">
        <h1 style="font-family: Georgia, serif; font-size: 2.5rem; margin-bottom: 1rem">

</html>
